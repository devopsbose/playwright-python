[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --tb=short
markers =
    smoke: Smoke tests - quick sanity checks
    regression: Full regression suite
    ui: UI browser tests
    api: API tests
    slow: Tests that take longer to run
